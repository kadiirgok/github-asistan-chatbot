name: keepalive
# HF ücretsiz Space'ler 48 saat trafik almazsa uyur; düzenli ping uyumasını önler.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Space'i uyandır / canlı tut
        run: curl -fsS --retry 5 --retry-delay 30 --max-time 120 https://akadirgok-github-asistani.hf.space/health
